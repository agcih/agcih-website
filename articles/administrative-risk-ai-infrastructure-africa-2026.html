<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrative Risk: A Governance Framework for AI Infrastructure in Africa | AGCIH</title>
  <meta name="description" content="AGCIH Working Paper WP-2026-01. Administrative Risk: A Governance Framework for AI Infrastructure in Africa." />
  <meta name="author" content="Africa Governance and Civic Innovation Hub (AGCIH)" />
  <meta property="og:title" content="Administrative Risk: A Governance Framework for AI Infrastructure in Africa" />
  <meta property="og:description" content="A governance framework for the AI infrastructure moment in Africa, introducing administrative risk, institutional absorption, and pro-governability." />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="AGCIH" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #1F3864;
      --navy-deep: #162845;
      --navy-mid: #2A4A7F;
      --purple: #5B2D8E;
      --purple-mid: #6B3FA0;
      --purple-pale: #EDE5F5;
      --bg: #FAFAF8;
      --text: #1A1A2E;
      --text-mid: #3D3D5C;
      --text-light: #6B6B8A;
      --rule: #E0DCF0;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Source Serif 4', Georgia, serif;
      --font-ui: 'DM Sans', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 18px; scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      line-height: 1.78;
      -webkit-font-smoothing: antialiased;
    }

    .site-header {
      background: var(--navy-deep);
      padding: 0.8rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--purple);
    }

    .site-header .brand {
      font-family: var(--font-ui);
      font-size: 0.72rem;
      font-weight: 600;
      color: #AABBDD;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .site-header nav a {
      font-family: var(--font-ui);
      font-size: 0.78rem;
      color: #9AACCB;
      text-decoration: none;
      margin-left: 1.5rem;
      transition: color 0.2s;
    }

    .site-header nav a:hover { color: #FFFFFF; }

    .hero {
      background: var(--navy);
      background-image:
        radial-gradient(ellipse at 80% 0%, rgba(91,45,142,0.25) 0%, transparent 55%),
        radial-gradient(ellipse at 0% 100%, rgba(42,74,127,0.35) 0%, transparent 50%);
      padding: 5rem 2rem 4rem;
    }

    .hero-inner { max-width: 850px; margin: 0 auto; }

    .hero-series {
      font-family: var(--font-ui);
      font-size: 0.7rem;
      font-weight: 600;
      color: #A07DD0;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .hero-series::before {
      content: '';
      display: block;
      width: 2rem;
      height: 2px;
      background: var(--purple-mid);
    }

    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .hero-subtitle {
      font-size: 1.08rem;
      color: #C7D5E8;
      font-style: italic;
      margin-bottom: 2.2rem;
      line-height: 1.6;
      max-width: 760px;
    }

    .hero-byline {
      border-top: 1px solid rgba(107,63,160,0.4);
      padding-top: 1.2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      align-items: center;
    }

    .hero-byline .author,
    .hero-byline .affil {
      font-family: var(--font-ui);
      font-size: 0.84rem;
    }

    .hero-byline .author {
      font-weight: 600;
      color: #FFFFFF;
    }

    .hero-byline .affil {
      color: #9AACCB;
    }

    .hero-byline .affil a {
      color: #A07DD0;
      text-decoration: none;
    }

    .article-wrap {
      max-width: 850px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-ui);
      font-size: 0.8rem;
      color: var(--purple-mid);
      text-decoration: none;
      margin: 2rem 0 0;
      padding: 0.5rem 0;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .back-link:hover { border-color: var(--purple-mid); }
    .back-link::before { content: '\2190'; font-size: 1rem; }
